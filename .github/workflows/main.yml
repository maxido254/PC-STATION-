name: Build PCStation Launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile src/pcstation_launcher.py src/pcstation_launcher_app.py src/pcstation_launcher_ui.py
      - run: python -m unittest discover -s src/tests -v

  windows:
    name: Windows setup program
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install -r requirements.txt pyinstaller
      - name: Tests on Windows (informational)
        continue-on-error: true
        timeout-minutes: 5
        run: python -m unittest discover -s src/tests -v
      - name: Build the launcher exe
        run: pyinstaller --onefile --windowed --name PCStation-Launcher --icon branding/icon.ico --paths src --collect-all webview src/pcstation_launcher_app.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Get the WebView2 runtime installer (bundled so the app never needs a browser)
        run: |
          mkdir -p dist
          curl -L -o dist/MicrosoftEdgeWebview2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          ls -la dist
      - name: Set app version
        id: app_version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the setup program
        run: |
          mkdir -p dist
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=${{ steps.app_version.outputs.value }}" installer/PCStationLauncher.iss
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: PCStation-Launcher-Setup
          path: dist/PCStation-Launcher-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PCStation-Launcher-Portable
          path: dist/PCStation-Launcher.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PCStation Launcher v1.0.0.1 Beta
          body: Beta release of PCStation Launcher.
          prerelease: true
          files: |
            dist/PCStation-Launcher-Setup.exe
            dist/PCStation-Launcher.exe
