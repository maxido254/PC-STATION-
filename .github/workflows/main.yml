name: Build PCStation Launcher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile src/pcstation_launcher.py src/pcstation_launcher_app.py src/pcstation_launcher_ui.py
      - run: python -m unittest discover -s src/tests -v

  windows:
    name: Windows setup program
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install pyinstaller
      - name: Tests on Windows (informational)
        continue-on-error: true
        run: python -m unittest discover -s src/tests -v
      - name: Build the launcher exe
        run: pyinstaller --onefile --windowed --name PCStation-Launcher --icon branding/icon.ico --paths src src/pcstation_launcher_app.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the setup program
        run: |
          mkdir -p dist
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=1.0.${{ github.run_number }}" installer/PCStationLauncher.iss
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: PCStation-Launcher-Setup
          path: dist/PCStation-Launcher-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PCStation-Launcher-Portable
          path: dist/PCStation-Launcher.exe
