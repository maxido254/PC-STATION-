name: Build PCStation Launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile src/pcstation_launcher.py src/pcstation_launcher_app.py src/pcstation_launcher_ui.py
      - run: python -m unittest discover -s src/tests -v

  windows:
    name: Windows setup program
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install -r requirements.txt pyinstaller
      - name: Tests on Windows (informational)
        continue-on-error: true
        timeout-minutes: 5
        run: python -m unittest discover -s src/tests -v
      - name: Build the launcher exe
        run: pyinstaller --onefile --windowed --name PCStation-Launcher --icon branding/icon.ico --paths src --collect-all webview src/pcstation_launcher_app.py
      - name: Get the WebView2 runtime installer (bundled so the app never needs a browser)
        run: |
          mkdir -p dist
          curl -L -o dist/MicrosoftEdgeWebview2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          ls -la dist
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE\\.dotnet\\tools" >> "$GITHUB_PATH"
          export PATH="$PATH:$HOME/.dotnet/tools"
          wix --version
      - name: Build the MSI
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p build
          cp installer/Product.wxs build/Product.wxs
          cp dist/PCStation-Launcher.exe dist/MicrosoftEdgeWebview2Setup.exe build/
          cp branding/icon.ico build/
          cd build
          sed -i "s/__VERSION__/1.0.${GITHUB_RUN_NUMBER}/" Product.wxs
          wix build -arch x64 -o PCStation-Launcher.msi Product.wxs
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: PCStation-Launcher-Installer
          path: build/PCStation-Launcher.msi
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: PCStation Launcher ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: PCStation Launcher for Windows. Download PCStation-Launcher.msi and open it to install.
          prerelease: false
          files: build/PCStation-Launcher.msi
